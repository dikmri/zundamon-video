  <meta name="theme-color" content="#F2F1EA">

  <meta name="za-catalog" content="../runtime/portal/catalog.js">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/portal.css">
  <!-- file:// で直接開いても動くよう、モジュールではなく通常のスクリプトとして順に読む -->

  <script src="js/log.js" defer></script>
  <script src="js/fx.js" defer></script>
  <script src="js/player.js" defer></script>
  <script src="js/main.js" defer></script>
</head>

  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span class="cursor-ring"><span class="cursor-label"></span></span></div>

  <header class="topbar" data-theme-surface>
    <a class="brand" href="#/" aria-label="Zunda Archive トップへ">
      <svg class="brand-mark" aria-hidden="true"><use href="#i-bean"/></svg>
      <span class="brand-word">Zunda<em>Archive</em></span>
    </a>
    <nav class="topnav" aria-label="サイト内">
      <a href="#/" data-jump="index">Index</a>
      <a href="#/" data-jump="voices">Voices</a>
      <a href="#/" data-jump="credits">Credits</a>
    </nav>
    <div class="topbar-meta mono">
      <span class="clock" aria-label="現在時刻">--:--</span>
      <span class="count" aria-live="polite"></span>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="view" id="view"></div>
  </main>

  <div class="loader" aria-hidden="true">
    <svg class="loader-bean"><use href="#i-bean"/></svg>
    <span class="loader-text mono">読み込み中なのだ…</span>
  </div>

  <div class="floating-preview" aria-hidden="true"><video muted playsinline loop preload="none"></video><span class="fp-time mono"></span></div>

  <div class="toast" role="status" aria-live="polite"></div>

  <dialog class="keys" aria-labelledby="keys-title">
    <h2 id="keys-title">キーボード操作</h2>
    <dl>
      <dt><kbd>Space</kbd> / <kbd>K</kbd></dt><dd>再生・一時停止</dd>
      <dt><kbd>J</kbd> / <kbd>L</kbd></dt><dd>10秒戻る・進む</dd>
      <dt><kbd>←</kbd> / <kbd>→</kbd></dt><dd>5秒戻る・進む</dd>
      <dt><kbd>↑</kbd> / <kbd>↓</kbd></dt><dd>音量</dd>
      <dt><kbd>P</kbd> / <kbd>N</kbd></dt><dd>前・次の章</dd>
      <dt><kbd>Shift</kbd>+<kbd>&lt;</kbd> / <kbd>&gt;</kbd></dt><dd>再生速度</dd>
      <dt><kbd>0</kbd>〜<kbd>9</kbd></dt><dd>その割合の位置へ</dd>
      <dt><kbd>M</kbd> / <kbd>F</kbd></dt><dd>ミュート・全画面</dd>
      <dt><kbd>T</kbd></dt><dd>シアターモード（動画を広く）</dd>
      <dt><kbd>/</kbd></dt><dd>検索</dd>
      <dt><kbd>?</kbd></dt><dd>この一覧</dd>
    </dl>
    <form method="dialog"><button class="btn-ghost">閉じる</button></form>
  </dialog>
  <noscript><p class="noscript">このサイトは JavaScript を使います。</p></noscript>
</body>
</html>
